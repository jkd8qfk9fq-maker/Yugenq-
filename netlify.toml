# ==========================================================================
# Netlify 設定（旧公開先）
# 公開は Cloudflare（yugenq.kigyo-hyakka.com、wrangler.jsonc）に移した。
# 旧アドレス（yugenqjp.netlify.app）への訪問は、同じパスのまま新しいアドレスへ恒久転送する。
# ==========================================================================

[build]
  publish = "."

[[redirects]]
  from = "/*"
  to = "https://yugenq.kigyo-hyakka.com/:splat"
  status = 301
  force = true
